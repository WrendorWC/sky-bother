# Fallback project definition for XcodeGen.
#
# SkyBother.xcodeproj is checked in and should open directly. If it ever fails
# to open — a corrupted merge, or a much older Xcode — regenerate it with:
#
#     brew install xcodegen && xcodegen generate
#
name: SkyBother
options:
  bundleIdPrefix: com.skybother
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  SkyBother:
    type: application
    platform: macOS
    sources:
      # A plain glob would turn Catalog/Images into a regular group — each
      # photo copied loose into the bundle's Resources root — but
      # TargetImageCatalog.swift looks photos up with
      # `subdirectory: "Images"`, which needs the folder copied as a single
      # unit (a "folder reference", Xcode's blue-folder icon) so it survives
      # as Resources/Images/ in the built app. Excluded from the main glob
      # and re-added below with `type: folder` to get that treatment.
      - path: SkyBother
        excludes:
          - Catalog/Images
          - Catalog/SkyThumbnails
      - path: SkyBother/Catalog/Images
        type: folder
      # Same treatment for the same reason: TargetImageCatalog looks these up
      # with `subdirectory: "SkyThumbnails"`, which needs the folder copied as
      # a unit rather than its contents scattered into Resources.
      - path: SkyBother/Catalog/SkyThumbnails
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skybother.SkyBother
        GENERATE_INFOPLIST_FILE: YES
        # PRODUCT_NAME, not just a CFBundleDisplayName override, because
        # Xcode's auto-generated Info.plist hardcodes CFBundleName to
        # $(PRODUCT_NAME) regardless of any INFOPLIST_KEY_CFBundleName
        # setting — and CFBundleName, not CFBundleDisplayName, is what the
        # About panel and the bold app-menu title actually read (confirmed:
        # a CFBundleDisplayName-only attempt fixed Finder/Dock but left
        # those two still showing "SkyBother"). The built .app is therefore
        # literally "Sky Bother?.app" — valid on macOS (only ":" and "/" are
        # actually reserved), it just needs quoting in build/zip/codesign
        # commands the way the parent folder's own space already requires.
        PRODUCT_NAME: "Sky Bother?"
        INFOPLIST_KEY_CFBundleDisplayName: "Sky Bother?"
        # macOS asks before an app talks to devices on the local network;
        # this is the reason it shows, for finding and reading a smart
        # telescope's live stack in Session View.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Sky Bother looks for your smart telescope on this network so Session View can show its live stack. It only reads the picture; it never controls the telescope."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  # Unit tests for the app's plain logic. Deliberately not hosted in the app:
  # a test host would launch Sky Bother itself, which quits on sight of the
  # installed copy already running (AppDelegate.terminateIfAlreadyRunning) and
  # would fetch forecasts and read the real settings file besides. Compiling
  # the sources straight into the bundle avoids all of that. SkyBotherApp.swift
  # is left out because it holds @main; nothing else refers to what's in it.
  SkyBotherTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SkyBother
        excludes:
          - SkyBotherApp.swift
          - Catalog/Images
          - Catalog/SkyThumbnails
          - Assets.xcassets
          - "**/*.json"
          - "**/*.jpg"
      - path: SkyBotherTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skybother.SkyBotherTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

schemes:
  SkyBother:
    build:
      targets:
        SkyBother: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SkyBotherTests
    archive:
      config: Release
