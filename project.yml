# Fallback project definition for XcodeGen.
#
# SkyBother.xcodeproj is checked in and should open directly. If it ever fails
# to open — a corrupted merge, or a much older Xcode — regenerate it with:
#
#     brew install xcodegen && xcodegen generate
#
name: SkyBother
options:
  bundleIdPrefix: com.skybother
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  SkyBother:
    type: application
    platform: macOS
    sources:
      - SkyBother
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skybother.SkyBother
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
