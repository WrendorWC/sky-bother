}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;style&gt;
#sky-bother-walkthrough {
  --sb-bg: light-dark(#ebe9f1, #080711);
  --sb-window: light-dark(#f8f7fb, #0e0c18);
  --sb-surface: light-dark(#ffffff, #171422);
  --sb-surface-2: light-dark(#f0edf6, #211c30);
  --sb-border: light-dark(#d6d0df, #373046);
  --sb-text: light-dark(#211c2a, #f5f1fb);
  --sb-muted: light-dark(#6f6679, #aaa1b6);
  --sb-accent: light-dark(#6d4dac, #9373dd);
  --sb-accent-soft: light-dark(#e5dcf7, #2f2547);
  --sb-green: light-dark(#147a48, #52d987);
  --sb-yellow: light-dark(#9b6512, #e8b958);
  --sb-red: light-dark(#a93d4c, #e06472);
  --sb-blue: light-dark(#2e6da1, #6aa7d9);
  --sb-gap: 12px;
  color: var(--sb-text);
  display: grid;
  gap: 12px;
  width: 100%;
}
#sky-bother-walkthrough * { box-sizing: border-box; }
#sky-bother-walkthrough button, #sky-bother-walkthrough input, #sky-bother-walkthrough select { font: inherit; }
#sky-bother-walkthrough .sb-window { background: var(--sb-window); border: 1px solid var(--sb-border); border-radius: 18px; overflow: hidden; min-height: 700px; box-shadow: 0 18px 50px color-mix(in srgb, var(--sb-bg) 75%, transparent); }
#sky-bother-walkthrough .sb-titlebar { min-height: 58px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 16px; background:var(--sb-surface); border-bottom:1px solid var(--sb-border); }
#sky-bother-walkthrough .sb-title, #sky-bother-walkthrough .sb-title-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
#sky-bother-walkthrough .sb-title { font-weight:500; }
#sky-bother-walkthrough .sb-logo { color:var(--sb-accent); font-size:22px; }
#sky-bother-walkthrough .sb-context, #sky-bother-walkthrough small, #sky-bother-walkthrough .sb-chart-note { color:var(--sb-muted); }
#sky-bother-walkthrough button { color:var(--sb-text); background:var(--sb-surface-2); border:1px solid var(--sb-border); border-radius:9px; padding:7px 11px; cursor:pointer; }
#sky-bother-walkthrough button:hover { border-color:var(--sb-accent); }
#sky-bother-walkthrough .sb-primary { background:var(--sb-accent); color:#fff; border-color:transparent; }
#sky-bother-walkthrough .sb-section-label { text-transform:uppercase; letter-spacing:.07em; color:var(--sb-accent); font-size:12px; font-weight:500; }
#sky-bother-walkthrough h1, #sky-bother-walkthrough h2, #sky-bother-walkthrough h3, #sky-bother-walkthrough p { margin:0; }
#sky-bother-walkthrough h1 { font-size:28px; } #sky-bother-walkthrough h2 { font-size:20px; } #sky-bother-walkthrough h3 { font-size:14px; margin-top:16px; }
#sky-bother-walkthrough .sb-home-grid { display:grid; grid-template-columns:210px minmax(380px,1fr) minmax(270px,350px); min-height:640px; }
#sky-bother-walkthrough .sb-night-rail, #sky-bother-walkthrough .sb-inspector { background:var(--sb-surface); padding:16px; }
#sky-bother-walkthrough .sb-night-rail { border-right:1px solid var(--sb-border); display:flex; flex-direction:column; gap:7px; }
#sky-bother-walkthrough .sb-inspector { border-left:1px solid var(--sb-border); }
#sky-bother-walkthrough .sb-night { display:grid; grid-template-columns:42px 1fr; align-items:center; gap:9px; background:transparent; border-color:transparent; text-align:left; width:100%; }
#sky-bother-walkthrough .sb-night small, #sky-bother-walkthrough .sb-plan-row small, #sky-bother-walkthrough .sb-candidate small, #sky-bother-walkthrough .sb-site-choice small, #sky-bother-walkthrough .sb-next-target small { display:block; margin-top:3px; }
#sky-bother-walkthrough .sb-night.is-selected, #sky-bother-walkthrough .sb-target.is-selected { background:var(--sb-accent-soft); border-color:var(--sb-accent); }
#sky-bother-walkthrough .sb-score { width:36px; height:36px; flex:0 0 36px; border-radius:50%; display:inline-grid; place-items:center; border:3px solid currentColor; font-weight:500; }
#sky-bother-walkthrough .sb-score.large { width:58px; height:58px; font-size:22px; }
#sky-bother-walkthrough .sb-score.poor { color:var(--sb-red); } #sky-bother-walkthrough .sb-score.marginal, #sky-bother-walkthrough .marginal-text { color:var(--sb-yellow); } #sky-bother-walkthrough .sb-score.good { color:var(--sb-blue); } #sky-bother-walkthrough .sb-score.excellent, #sky-bother-walkthrough .sb-score.exceptional { color:var(--sb-green); }
#sky-bother-walkthrough .sb-nearby { margin-top:auto; border-top:1px solid var(--sb-border); padding-top:14px; display:grid; gap:8px; }
#sky-bother-walkthrough .sb-home-main { padding:16px; display:grid; align-content:start; gap:14px; }
#sky-bother-walkthrough .sb-night-summary { display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; background:var(--sb-surface); border:1px solid var(--sb-border); border-radius:14px; padding:16px; }

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;sky-bother-walkthrough&#x27;);
  const screenIds = [&#x27;home&#x27;, &#x27;plan&#x27;, &#x27;sky&#x27;, &#x27;catalog&#x27;, &#x27;setup&#x27;, &#x27;session&#x27;];
  const selectScreen = (name) =&gt; {
    screenIds.forEach((id) =&gt; {
      const tab = root.querySelector(`#sb-tab-${id}`);
      const panel = root.querySelector(`#sb-screen-${id}`);
      const active = id === name;
      tab.classList.toggle(&#x27;active&#x27;, active);
      tab.setAttribute(&#x27;aria-selected&#x27;, String(active));
      panel.hidden = !active;
    });
  };
  root.querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;).forEach((tab) =&gt; tab.addEventListener(&#x27;click&#x27;, () =&gt; selectScreen(tab.id.replace(&#x27;sb-tab-&#x27;, &#x27;&#x27;))));
  root.querySelectorAll(&#x27;[data-go]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; selectScreen(button.dataset.go)));

  root.querySelectorAll(&#x27;.sb-target&#x27;).forEach((target) =&gt; target.addEventListener(&#x27;click&#x27;, () =&gt; {
    root.querySelectorAll(&#x27;.sb-target&#x27;).forEach((row) =&gt; row.classList.remove(&#x27;is-selected&#x27;));
    target.classList.add(&#x27;is-selected&#x27;);
    root.querySelectorAll(&#x27;.sb-selected-name&#x27;).forEach((node) =&gt; node.textContent = target.dataset.name);
    root.querySelectorAll(&#x27;.sb-selected-score&#x27;).forEach((node) =&gt; node.textContent = target.dataset.score);
    root.querySelectorAll(&#x27;.sb-selected-reason&#x27;).forEach((node) =&gt; node.textContent = target.dataset.reason);
  }));

  const addButton = root.querySelector(&#x27;.sb-add&#x27;);
  addButton.addEventListener(&#x27;click&#x27;, () =&gt; {
    addButton.textContent = addButton.textContent === &#x27;Added to plan&#x27; ? &#x27;Add to plan&#x27; : &#x27;Added to plan&#x27;;
    addButton.disabled = true;
    root.querySelector(&#x27;.sb-save-state&#x27;).textContent = &#x27;Unsaved changes&#x27;;
  });

  const play = root.querySelector(&#x27;.sb-play&#x27;);
  play.addEventListener(&#x27;click&#x27;, () =&gt; { play.textContent = play.textContent === &#x27;Play&#x27; ? &#x27;Pause&#x27; : &#x27;Play&#x27;; });
  const jump = root.querySelector(&#x27;.sb-jump&#x27;);
  jump.addEventListener(&#x27;click&#x27;, () =&gt; {
    root.querySelectorAll(&#x27;.sb-sky-time&#x27;).forEach((node) =&gt; node.textContent = &#x27;05:17&#x27;);
    root.querySelector(&#x27;.sb-status-text&#x27;).textContent = &#x27;Altitude 87° · WNW · at peak&#x27;;
    root.querySelector(&#x27;#sb-screen-sky input[type=&quot;range&quot;]&#x27;).value = 80;
  });

  const setupSteps = [
    [&#x27;Choose your observing site&#x27;, &#x27;Search by town city or landmark. You can fine tune coordinates later.&#x27;],
    [&#x27;Describe your horizon&#x27;, &#x27;Start with one simple value or customize the eight compass directions.&#x27;],
    [&#x27;Choose your imaging rig&#x27;, &#x27;Pick a preset first. Advanced optical values remain available.&#x27;],
    [&#x27;Choose a planning goal&#x27;, &#x27;Use Quick session, Deep integration, Variety, or Custom.&#x27;],
    [&#x27;Review your first plan&#x27;, &#x27;See the best upcoming night and why each target was chosen.&#x27;]
  ];
  let setupIndex = 0;
  const renderSetup = () =&gt; {
    root.querySelector(&#x27;.sb-setup-number&#x27;).textContent = String(setupIndex + 1);
    root.querySelector(&#x27;.sb-setup-heading&#x27;).textContent = setupSteps[setupIndex][0];
    root.querySelector(&#x27;.sb-setup-copy&#x27;).textContent = setupSteps[setupIndex][1];
    root.querySelectorAll(&#x27;.sb-steps button&#x27;).forEach((button, index) =&gt; button.classList.toggle(&#x27;is-active&#x27;, index === setupIndex));
    root.querySelector(&#x27;.sb-back&#x27;).disabled = setupIndex === 0;
    root.querySelector(&#x27;.sb-continue&#x27;).textContent = setupIndex === 4 ? &#x27;Finish setup&#x27; : &#x27;Continue&#x27;;
  };
  root.querySelector(&#x27;.sb-continue&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { setupIndex = Math.min(4, setupIndex + 1); renderSetup(); });
  root.querySelector(&#x27;.sb-back&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { setupIndex = Math.max(0, setupIndex - 1); renderSetup(); });

  const complete = root.querySelector(&#x27;.sb-complete&#x27;);
  complete.addEventListener(&#x27;click&#x27;, () =&gt; {
    root.querySelector(&#x27;.sb-session-target&#x27;).textContent = &#x27;Little Dumbbell&#x27;;
    root.querySelector(&#x27;.sb-session-time&#x27;).textContent = &#x27;23:25–02:55 · 3h 30m remaining&#x27;;
    root.querySelector(&#x27;.sb-session-progress b&#x27;).style.width = &#x27;0%&#x27;;
    root.querySelector(&#x27;.sb-session-count&#x27;).textContent = &#x27;2 of 3 targets · 2h captured&#x27;;
  });

  const design = { density: &#x27;Comfortable&#x27;, inspectorWidth: 32, accent: &#x27;#9373dd&#x27; };
  const renderDesign = () =&gt; {
    root.style.setProperty(&#x27;--sb-gap&#x27;, design.density === &#x27;Compact&#x27; ? &#x27;8px&#x27; : &#x27;12px&#x27;);
    root.style.setProperty(&#x27;--sb-inspector-width&#x27;, `${design.inspectorWidth}%`);
    root.style.setProperty(&#x27;--sb-accent&#x27;, design.accent);
  };
  renderDesign();
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: renderDesign });
    tweak.addSelect(design, &#x27;density&#x27;, { label: &#x27;Information density&#x27;, options: [&#x27;Comfortable&#x27;, &#x27;Compact&#x27;], reference: &#x27;layout.density&#x27; });
    tweak.addSlider(design, &#x27;inspectorWidth&#x27;, { label: &#x27;Inspector width&#x27;, min: 26, max: 40, unit: &#x27;%&#x27;, reference: &#x27;planner.inspector-width&#x27; });
    tweak.addColorPicker(design, &#x27;accent&#x27;, { label: &#x27;Accent color&#x27;, reference: &#x27;--sb-accent&#x27; });
  }
})();

&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {

  }

  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }

  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );

      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));

  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;

  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {

            );

              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,

      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,

      .then(({ x, y }) =&gt; {

      });

  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }

    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {

    }

  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };

    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {

      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {

      return;

      closeTooltip();

    const trigger = getTrigger(event.target);

    }

    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };

    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {

  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;

    const panelId = selected.getAttribute(&quot;aria-controls&quot;);

      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);

      return;

      return;

      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;

      return;

    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {

      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??

    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
